# CloudFlare Pages Configuration
# Documentation: https://developers.cloudflare.com/pages/configuration/wrangler-configuration/
#
# IMPORTANT: CloudFlare Pages' wrangler.toml support is BETA and only accepts a
# small subset of fields. Earlier versions of this file included Workers-only
# concepts (`[build]`, `[build.environment]`) and Pages concepts that simply
# don't exist as wrangler.toml fields (`deployment`, `headers`, `redirects`,
# `functions`, `analytics`, `error_pages`). A real deploy failed with:
#
#   - Unexpected fields found in build field: "environment"
#   - Unexpected fields found in top-level field: "deployment","headers",
#     "redirects","functions","analytics","error_pages"
#   - Configuration file for Pages projects does not support "build"
#   Failed: unable to read the Wrangler configuration file with code: 1
#
# Everything that was in those removed sections now lives in its correct
# CloudFlare-native place — see CLOUDFLARE_DEPLOYMENT.md for the full mapping:
#   - Build command / output directory → Dashboard: Settings > Builds &
#     deployments > Build configuration (NOT wrangler.toml's [build] table,
#     which is a Workers-only concept and is rejected outright for Pages).
#   - Production/preview branch rules  → Dashboard: Settings > Builds &
#     deployments > Branch deployments.
#   - Custom headers                   → static/_headers (Hugo copies this
#     verbatim into public/_headers at build time).
#   - Redirects                        → static/_redirects (same mechanism).
#   - Pages Functions                  → a functions/ directory at the repo
#     root (file-based routing) — not used by this project, no declaration
#     needed either way.
#   - Web Analytics                    → Dashboard toggle (injects its own
#     beacon script) — not a wrangler.toml field.
#   - Custom error pages                → public/404.html, which Hugo already
#     generates from layouts/404.html and CloudFlare Pages serves
#     automatically for any unmatched route. No config needed.
#
# Only add a field back here after confirming it's actually accepted by
# Pages' wrangler.toml validator — the error message above is the ground
# truth; the Cloudflare docs page linked at the top lists the current set.

# Project name (must match the CloudFlare Pages project name)
name = "dxers-site"

# Compatibility date for the Workers runtime features Pages Functions use.
# This project has no Pages Functions today, but the field is still required.
compatibility_date = "2024-01-01"

# Build output directory (relative to the repo root)
pages_build_output_dir = "public"

# ============================================================================
# Environment variables
# ============================================================================
# These ARE read by CloudFlare Pages' build environment (injected before the
# Dashboard-configured build command runs) — verified as accepted by the
# wrangler.toml (BETA) validator, unlike the sections removed above.

[env.production.vars]
HUGO_VERSION = "0.154.3"
HUGO_ENV = "production"
HUGO_ENABLEGITINFO = "true"
NODE_VERSION = "22"
NODE_ENV = "production"
GO_VERSION = "1.21"
SITE_URL = "https://www.dxers.ug"
BASE_URL = "https://www.dxers.ug/"

[env.preview.vars]
HUGO_VERSION = "0.154.3"
HUGO_ENV = "development"
HUGO_ENABLEGITINFO = "false"
NODE_VERSION = "22"
NODE_ENV = "development"
GO_VERSION = "1.21"
