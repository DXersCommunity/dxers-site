# CloudFlare Pages Configuration
# Documentation: https://developers.cloudflare.com/pages/

# Project name (must match CloudFlare Pages project name)
name = "dxers-site"

# Compatibility settings
compatibility_date = "2024-01-01"

# Pages configuration
pages_build_output_dir = "public"

# ============================================================================
# Production Environment
# ============================================================================
[env.production]
# Production environment variables
[env.production.vars]
# Hugo configuration
HUGO_VERSION = "0.154.1"
HUGO_ENV = "production"
HUGO_ENABLEGITINFO = "true"

# Node.js configuration
NODE_VERSION = "22"
NODE_ENV = "production"
NPM_VERSION = "10"

# Build configuration
BUILD_COMMAND = "npm install && hugo --minify"
BUILD_OUTPUT_DIR = "public"

# Site configuration
SITE_URL = "https://www.dxers.ug"
BASE_URL = "https://www.dxers.ug/"

# Feature flags
ENABLE_ANALYTICS = "true"
ENABLE_SEARCH = "true"
ENABLE_SITEMAP = "true"

# ============================================================================
# Preview Environment (for Pull Requests and branch deploys)
# ============================================================================
[env.preview]
# Preview environment variables
[env.preview.vars]
# Hugo configuration
HUGO_VERSION = "0.154.1"
HUGO_ENV = "development"
HUGO_ENABLEGITINFO = "false"

# Node.js configuration
NODE_VERSION = "22"
NODE_ENV = "development"
NPM_VERSION = "10"

# Build configuration
BUILD_COMMAND = "npm install && hugo --minify -D -F"
BUILD_OUTPUT_DIR = "public"

# Site configuration (preview URLs are auto-generated by CloudFlare)
SITE_URL = ""
BASE_URL = "/"

# Feature flags
ENABLE_ANALYTICS = "false"
ENABLE_SEARCH = "false"
ENABLE_SITEMAP = "false"

# ============================================================================
# Build Configuration
# ============================================================================
[build]
command = "npm install && hugo --minify"
cwd = ""
watch_dir = "content"

[build.environment]
# Build environment variables (applied to all environments)
HUGO_VERSION = "0.154.1"
NODE_VERSION = "22"

# ============================================================================
# Deployment Configuration
# ============================================================================
[deployment]
# Production branch (auto-deploy)
production_branch = "dxers-site"

# Preview branches (auto-deploy previews)
preview_branch_includes = ["feat/*", "fix/*", "docs/*", "chore/*", "claude/*"]

# Exclude certain branches from preview deployments
preview_branch_excludes = ["dependabot/*"]

# ============================================================================
# Custom Headers
# ============================================================================
[[headers]]
for = "/*"
[headers.values]
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
X-XSS-Protection = "1; mode=block"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
for = "/*.css"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.js"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.png"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.jpg"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.svg"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.woff2"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

# ============================================================================
# Redirects
# ============================================================================
[[redirects]]
from = "/discord"
to = "https://discord.gg/RtG4nyCEDX"
status = 301

[[redirects]]
from = "/github"
to = "https://github.com/DXersCommunity/dxers-site"
status = 301

# ============================================================================
# Functions (CloudFlare Workers - if needed)
# ============================================================================
[functions]
# Directory for CloudFlare Workers functions
directory = "functions"

# ============================================================================
# Analytics (CloudFlare Web Analytics)
# ============================================================================
[analytics]
# Enable CloudFlare Web Analytics
enabled = true

# ============================================================================
# Error Pages
# ============================================================================
[error_pages]
# Custom 404 page (Hugo generates this)
"404" = "/404.html"
